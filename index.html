<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101317">
  <title>Gitara: postępy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Gitara</h1>
    <span id="status" class="chip" role="status"></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <nav id="nav" hidden>
    <button data-act="nav" data-view="home">Start</button>
    <button data-act="nav" data-view="session">Sesja</button>
    <button data-act="nav" data-view="stats">Statystyki</button>
    <button data-act="nav" data-view="settings">Ustawienia</button>
  </nav>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
